name: Build APK

on:
  push:
    branches: [Realtime_AI_Translator_13_02_V1] # Match your active branch
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Build APK locally
        # This command creates 'app-release.apk' in your project root
        run: |
          npm install -g eas-cli
          eas build --platform android --profile preview --non-interactive --local --output=app-release.apk

      - name: 📂 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realtime-Translator-APK
          path: app-release.apk
          retention-days: 7
