name: Build APK

on:
  push:
    branches:
      - Realtime_AI_Translator_13_02_V1
      - Realtime_AI_Translator_13_02_v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This makes the token available to ALL steps below
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} 
    
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔑 Create .env file from secrets
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_OPENAI_API_KEY=${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_ELEVENLABS_API_KEY=${{ secrets.EXPO_PUBLIC_ELEVENLABS_API_KEY }}
          EXPO_PUBLIC_AWS_REGION=${{ secrets.EXPO_PUBLIC_AWS_REGION }}
          EXPO_PUBLIC_AWS_USER_POOL_ID=${{ secrets.EXPO_PUBLIC_AWS_USER_POOL_ID }}
          EXPO_PUBLIC_AWS_USER_POOL_CLIENT_ID=${{ secrets.EXPO_PUBLIC_AWS_USER_POOL_CLIENT_ID }}
          EXPO_PUBLIC_AWS_IDENTITY_POOL_ID=${{ secrets.EXPO_PUBLIC_AWS_IDENTITY_POOL_ID }}
          EOF

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Build APK locally
        run: |
          npm install -g eas-cli
          eas build --platform android --profile preview --non-interactive --local --output=app-release.apk

      - name: 📂 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realtime-Translator-APK-${{ github.ref_name }}
          path: app-release.apk
          retention-days: 7
